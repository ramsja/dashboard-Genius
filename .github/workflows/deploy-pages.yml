name: Deploy dashboard a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preconfigurar dashboard con Supabase
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            cat > dashboard/config.js <<CONFIG
          window.DASHBOARD_CONFIG = {
            snapshotUrl: './data/snapshot.json',
            supabase: {
              enabled: true,
              url: '$SUPABASE_URL',
              anonKey: '$SUPABASE_ANON_KEY',
              view: 'transaction_discipline_summary',
            },
          };
          CONFIG
            echo "config.js generado con Supabase habilitado"
          else
            echo "Supabase no configurado; se usa el JSON estatico"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
