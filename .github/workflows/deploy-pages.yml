name: Deploy dashboard a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preconfigurar dashboard con la API de D1
        run: |
          # Solo la URL del Worker entra en la pagina. No hay token ni clave:
          # el Worker decide que se puede leer.
          if [ -n "$D1_API_URL" ]; then
            cat > dashboard/config.js <<CONFIG
          window.DASHBOARD_CONFIG = {
            snapshotUrl: './data/snapshot.json',
            api: {
              enabled: true,
              url: '$D1_API_URL',
            },
          };
          CONFIG
            echo "config.js generado apuntando a $D1_API_URL"
          else
            echo "D1_API_URL no configurado; el dashboard usa el JSON estatico"
          fi
        env:
          D1_API_URL: ${{ secrets.D1_API_URL }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
