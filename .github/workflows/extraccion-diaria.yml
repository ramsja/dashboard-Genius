name: Extraccion diaria + publicar dashboard

on:
  schedule:
    # Cada 30 minutos, lunes a domingo
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: extraccion-diaria
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4 python-dotenv

      - name: Calcular fechas (ultimos 5 dias)
        id: dates
        run: |
          echo "start=$(date -d '5 days ago' +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "end=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Ejecutar extraccion (ultimos 5 dias)
        run: python extraccionDatos.py
        env:
          BO_USERNAME: ${{ secrets.BO_USERNAME }}
          BO_PASSWORD: ${{ secrets.BO_PASSWORD }}
          CAUSAL_PRODUCT_ID: ${{ secrets.CAUSAL_PRODUCT_ID }}
          START_DATE: ${{ steps.dates.outputs.start }}
          END_DATE: ${{ steps.dates.outputs.end }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Generar JSONs del dashboard
        run: |
          python construir-historico.py
          python construir-usuarios-historico.py
          python construir-top-juegos.py
          python construir-actividad-usuarios.py
          python construir-snapshot.py
          python importar-perp-casino.py descargas/transacciones_producto__*.csv

      - name: Actualizar snapshot
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          src = Path('reportes/dashboard-data.json')
          if src.exists():
              dst = Path('dashboard/data/snapshot.json')
              dst.write_text(src.read_text(encoding='utf-8'), encoding='utf-8')
              print('Snapshot actualizado:', dst)
          else:
              print('Sin reportes/dashboard-data.json; se mantiene el snapshot actual')
          EOF

      - name: Limpiar CSVs viejos (mantener ultimos 5 dias)
        run: |
          python - <<'EOF'
          from pathlib import Path
          from datetime import datetime, timedelta
          descargas = Path('descargas')
          cutoff = datetime.now() - timedelta(days=5)
          removed = 0
          for csv in descargas.glob('transacciones_producto__*.csv'):
              parts = csv.stem.split('__')
              if len(parts) >= 3:
                  try:
                      file_date = datetime.strptime(parts[2], '%Y-%m-%d')
                      if file_date < cutoff:
                          csv.unlink()
                          removed += 1
                  except ValueError:
                      pass
          print(f'CSVs eliminados: {removed}')
          EOF

      - name: Commit y push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/data/
          if git diff --cached --quiet; then
            echo 'Sin cambios'
          else
            git commit -m "chore: datos dashboard $(date +%Y-%m-%dT%H:%M)"
            git push
          fi
