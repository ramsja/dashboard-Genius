name: Extracción diaria + publicar dashboard

on:
  schedule:
    # 05:30 UTC de lunes a viernes (ajusta a tu zona horaria)
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4 python-dotenv

      - name: Ejecutar extracción y generar reportes
        run: python extraccionDatos.py
        env:
          BO_USERNAME: ${{ secrets.BO_USERNAME }}
          BO_PASSWORD: ${{ secrets.BO_PASSWORD }}
          CAUSAL_PRODUCT_ID: ${{ secrets.CAUSAL_PRODUCT_ID }}
          START_DATE: ${{ secrets.START_DATE }}
          END_DATE: ${{ secrets.END_DATE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Actualizar snapshot del dashboard
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          src = Path('reportes/dashboard-data.json')
          if not src.exists():
              raise SystemExit('No se generó reportes/dashboard-data.json')
          dst = Path('dashboard/data/snapshot.json')
          dst.write_text(src.read_text(encoding='utf-8'), encoding='utf-8')
          print('Snapshot actualizado:', dst)
          EOF

      - name: Desglose de tickets por deporte/disciplina
        run: python extraccion-tickets-deporte.py
        env:
          BO_USERNAME: ${{ secrets.BO_USERNAME }}
          BO_PASSWORD: ${{ secrets.BO_PASSWORD }}

      - name: Historial diario de transacciones y clientes
        run: python construir-historico.py descargas/

      - name: Commit y push del snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/data/snapshot.json dashboard/data/desglose-tickets.json dashboard/data/historico.json
          if git diff --cached --quiet; then
            echo 'Sin cambios en el snapshot'
          else
            git commit -m 'chore: snapshot diario + historial + desglose de tickets por deporte'
            git push
          fi