<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Dashboard Genius</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { font-size: 24px; color: #333; margin-bottom: 5px; text-align: center; }
        p.subtitle { font-size: 13px; color: #999; text-align: center; margin-bottom: 25px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #667eea; text-transform: uppercase; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 Dashboard Genius</h1>
        <p class="subtitle">Acceso administrativo</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <label>Usuario</label>
            <input type="text" id="username" autocomplete="username" required />
            <label>Contraseña</label>
            <input type="password" id="password" autocomplete="current-password" required />
            <button type="submit" id="submitBtn">Ingresar</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verificando...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok && data.ok) {
                    window.location.href = '/';
                } else {
                    errorBox.textContent = data.error || 'Usuario o contraseña incorrectos';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Error de conexión, intenta de nuevo';
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
